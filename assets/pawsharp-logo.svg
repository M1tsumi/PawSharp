<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2e3169"/>
      <stop offset="100%" stop-color="#1a1c36"/>
    </radialGradient>
    <radialGradient id="pad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7983f5"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="110" cy="110" r="108" fill="#5865F2" opacity="0.15"/>
  <!-- Background disc -->
  <circle cx="110" cy="110" r="104" fill="url(#bg)"/>

  <!-- Digit toes — top left -->
  <ellipse cx="60"  cy="92"  rx="18" ry="23" fill="url(#pad)" filter="url(#shadow)"
           transform="rotate(-28 60 92)"/>
  <!-- Digit toes — center left -->
  <ellipse cx="86"  cy="71"  rx="18" ry="23" fill="url(#pad)" filter="url(#shadow)"
           transform="rotate(-8 86 71)"/>
  <!-- Digit toes — center right -->
  <ellipse cx="134" cy="71"  rx="18" ry="23" fill="url(#pad)" filter="url(#shadow)"
           transform="rotate(8 134 71)"/>
  <!-- Digit toes — top right -->
  <ellipse cx="160" cy="92"  rx="18" ry="23" fill="url(#pad)" filter="url(#shadow)"
           transform="rotate(28 160 92)"/>

  <!-- Main heel pad -->
  <ellipse cx="110" cy="148" rx="44" ry="36" fill="url(#pad)" filter="url(#shadow)"/>

  <!-- Sharp / C# symbol on main pad -->
  <!-- Vertical lines of # -->
  <line x1="103" y1="135" x2="100" y2="162" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="117" y1="135" x2="114" y2="162" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Horizontal lines of # -->
  <line x1="96"  y1="143" x2="121" y2="143" stroke="white" stroke-width="4"   stroke-linecap="round"/>
  <line x1="94"  y1="153" x2="119" y2="153" stroke="white" stroke-width="4"   stroke-linecap="round"/>

  <!-- Subtle dot highlight on bg -->
  <circle cx="80" cy="75" r="28" fill="white" opacity="0.03"/>
</svg>
