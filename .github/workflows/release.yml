name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-release: v0.6.0-alpha1, v1.0.0-beta.2, etc.

permissions:
  contents: write

jobs:

  # ── 1. Build & Test ──────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0               # full history for changelog extraction

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Release hygiene guard
        shell: pwsh
        run: ./tools/check-release-hygiene.ps1

      - name: Restore
        run: dotnet restore PawSharp.sln

      - name: Build
        run: dotnet build PawSharp.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PawSharp.sln -c Release --no-build --nologo \
               --logger "trx;LogFileName=results.trx" \
               --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # ── 2. Pack NuGet ────────────────────────────────────────────────────────────
  pack:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PawSharp.sln

      - name: Build
        run: dotnet build PawSharp.sln -c Release --no-restore --nologo

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          rm -rf ./nupkgs
          mkdir -p ./nupkgs
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build --nologo \
              --output ./nupkgs \
              -p:PackageVersion=${{ steps.version.outputs.VERSION }}
          done

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*.nupkg
          retention-days: 30

  # ── 3. GitHub Release ────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: pack

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          # Write to file to handle multiline safely
          echo "$NOTES" > release_notes.md
          echo "file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PawSharp ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: nupkgs/*.nupkg
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Publish to NuGet.org ──────────────────────────────────────────────────
  nuget-publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: github-release
    # Only runs when NUGET_API_KEY secret is configured
    if: secrets.NUGET_API_KEY != ''
    environment: nuget

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
