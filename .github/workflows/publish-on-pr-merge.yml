name: Publish On PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main, master, 'release/**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'

permissions:
  contents: read

concurrency:
  group: publish-pr-merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Pack, Publish (merged PR)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Release hygiene guard
        shell: pwsh
        run: ./tools/check-release-hygiene.ps1

      - name: Restore
        run: dotnet restore PawSharp.sln

      - name: Build
        run: dotnet build PawSharp.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PawSharp.sln -c Release --no-build --nologo

      - name: Derive CI package version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Directory.Build.props)
          if [[ "$BASE_VERSION" == *"-"* ]]; then
            PACKAGE_VERSION="${BASE_VERSION}.ci.${GITHUB_RUN_NUMBER}"
          else
            PACKAGE_VERSION="${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using package version: $PACKAGE_VERSION"

      - name: Pack all library projects
        run: |
          rm -rf ./nupkgs
          mkdir -p ./nupkgs
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build --nologo \
              --output ./nupkgs \
              -p:PackageVersion=${{ steps.version.outputs.PACKAGE_VERSION }}
          done

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-pr-merge-${{ github.run_number }}
          path: nupkgs/*.nupkg
          retention-days: 14

      - name: Publish to NuGet.org
        if: secrets.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
